# Xbox 360 D3D entry points the plume renderer (src/redahm_engine/gpu) takes
# over or calls into. Addresses and prototypes verified against the Path of the
# Furon database; the device layout they imply lives in gpu/d3d/d3d_device.h.

[functions]
